# Release — PRD §13.5 step 2: on tag, build + push images to GHCR, SSH to the VPS, deploy the tag,
# migrate, health-check, roll back on failure (infra/scripts/deploy.sh does the VPS half).
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), DOMAIN, NEXT_PUBLIC_API_URL.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  images:
    name: build + push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: tc-api, dockerfile: infra/docker/Dockerfile.api }
          - { image: tc-web, dockerfile: infra/docker/Dockerfile.web }
          - { image: tc-backup, dockerfile: infra/docker/Dockerfile.backup }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.image }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy ${{ github.ref_name }} to the VPS
    runs-on: ubuntu-latest
    needs: images
    environment: production
    steps:
      - name: ssh + deploy.sh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/thesis-copilot/infra/compose
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOMAIN="${{ secrets.DOMAIN }}"
            ./deploy.sh "${{ github.ref_name }}"
