# CI — PRD §13.5 step 1: install, biome check, tsc --noEmit, vitest (Testcontainers), Playwright
# smoke, prisma migrate diff check, and the dependency audit from PRD §12.1.
#
# Two depths (ADR-0141), to spend fewer Actions minutes once the repo is private again:
# - quick, on an ordinary push to main: lint, typecheck, migrate-diff, audit, and the vitest suites
#   of the packages changed since the last green main run plus every package that depends on them.
# - full, everywhere else: every vitest suite and the Playwright smoke. That is a pull request, a
#   manual run (workflow_dispatch), and every release: release.yml calls this file with
#   `full: true` and deploys only if it passes, so no tag reaches the VPS without Playwright.
# No test is dropped (§0.3 rule 7): a suite a quick push does not run, the release runs.
name: ci

on:
  pull_request:
    # The same list as `push`. Kept written out twice rather than as a YAML anchor: boring.
    paths:
      - '**'
      - '!docs/**'
      # apps/web/test/i18n-review.spec.ts reads docs/i18n/hi-review.md.
      - 'docs/i18n/**'
      # Root Markdown (README.md, CLAUDE.md) and READMEs. Not `**/*.md`: packages/ai/prompts/*.md
      # and packages/ai/eval/candidates/*.md are product content that tests read.
      - '!*.md'
      - '!**/README.md'
  push:
    branches: [main]
    # A tag never comes through here: release.yml runs this workflow for a tag, unfiltered.
    paths:
      - '**'
      - '!docs/**'
      - 'docs/i18n/**'
      - '!*.md'
      - '!**/README.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      full:
        description: Run every vitest suite and the Playwright smoke.
        type: boolean
        default: true

# `actions: read` lets the quick mode find the last green run (`gh run list`).
permissions:
  contents: read
  actions: read

concurrency:
  # A newer push to main cancels the older run. That is safe for the quick mode because it diffs
  # against the last *green* run, not the previous push, so a cancelled push is tested next time.
  # `github.workflow` keeps a release's call (named "release") apart from a push's run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the runtime image (node:22-alpine) rather than whatever a laptop runs.
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.9
  # 'true' unless this is an ordinary push to main. Jobs cannot read `env` in `if:`, so the e2e
  # job repeats this expression; keep the two the same.
  FULL: ${{ github.event_name != 'push' || inputs.full == true || startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: lint · typecheck · unit+integration · migrate-diff · audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: tc, POSTGRES_PASSWORD: tc, POSTGRES_DB: tc }
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U tc -d tc" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The quick mode diffs against the last green run, which can be any number of commits back.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      # `cache: pnpm` caches the pnpm store, keyed on pnpm-lock.yaml.
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Decides which vitest suites run. Any doubt means all of them: no green run to diff from, a
      # history rewritten under it, or a change outside apps/ and packages/ (the lockfile, root
      # config, turbo.json, fixtures/, .github/), which Turborepo cannot place in one package.
      # Otherwise the changed packages and their dependents (`...[sha]`), so a change to
      # packages/db still runs apps/api's suites; docs/i18n/ adds @tc/web, whose test reads it.
      # `turbo run test --filter=...[sha] --dry=json` was checked against turbo 2.10.12; a selection
      # of no packages runs nothing and exits 0.
      - name: which suites to run
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full() { echo "every suite: $1"; echo "filter=" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$FULL" = "true" ] && full "full run (${GITHUB_EVENT_NAME} ${GITHUB_REF})"
          BASE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
          [ -n "$BASE" ] || full "no green ci run on main to diff from"
          git cat-file -e "${BASE}^{commit}" 2>/dev/null || full "last green ${BASE} is not in this clone"
          git merge-base --is-ancestor "$BASE" HEAD || full "last green ${BASE} is not an ancestor of HEAD"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "changed since last green ${BASE}:"; echo "$CHANGED" | sed 's/^/  /'
          OUTSIDE="$(echo "$CHANGED" | grep -vE '^(apps|packages)/' | grep -vE '^[^/]+\.md$' \
            | grep -vE '^docs/' || true)"
          [ -z "$(echo "$OUTSIDE" | tr -d '[:space:]')" ] || full "changed outside apps/ and packages/: $(echo $OUTSIDE)"
          FILTER="--filter=...[${BASE}]"
          if echo "$CHANGED" | grep -qE '^docs/i18n/'; then FILTER="${FILTER} --filter=@tc/web"; fi
          echo "changed packages and their dependents only: ${FILTER}"
          echo "filter=${FILTER}" >> "$GITHUB_OUTPUT"

      - name: biome check
        run: pnpm biome check .

      - name: prisma generate
        run: pnpm --filter @tc/db exec prisma generate

      - name: build packages (apps import their dist)
        run: pnpm turbo run build --filter='./packages/*'

      - name: typecheck
        run: pnpm turbo run typecheck

      - name: migrations match the schema (prisma migrate diff)
        # Applies every migration to the service Postgres, then asserts the schema file adds nothing
        # beyond the two HNSW indexes Prisma cannot declare (PRD §8) — see the check script.
        env:
          DATABASE_URL: postgresql://tc:tc@localhost:5434/tc
        run: |
          pnpm --filter @tc/db exec prisma migrate deploy
          node packages/db/scripts/migrate-diff-check.mjs

      - name: vitest (unit + integration via Testcontainers)
        # Testcontainers uses the runner's Docker daemon for Postgres and Redis. TEST_FILTER is empty
        # (every suite) except on a quick push. `set -f` because `[sha]` is a shell glob, and the
        # variable is split on purpose: it can hold two `--filter`s.
        env:
          TEST_FILTER: ${{ steps.scope.outputs.filter }}
        run: |
          set -f
          pnpm turbo run test $TEST_FILTER

      - name: dependency audit (PRD §12.1)
        run: pnpm audit --audit-level=high

  e2e-smoke:
    name: playwright smoke
    runs-on: ubuntu-latest
    # The suite itself runs in about ten minutes. The headroom is for failures: each one retries
    # once and several wait out a two-minute timeout before they do, so a bad run costs far more
    # than a good one. Twenty-five was not enough to reach the end of a bad run and report it.
    timeout-minutes: 40
    needs: checks
    # Not on an ordinary push to main (ADR-0141): on a pull request, a manual run and every release.
    # The same expression as `env.FULL`, which `if:` cannot read.
    if: ${{ github.event_name != 'push' || inputs.full == true || startsWith(github.ref, 'refs/tags/') }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: tc, POSTGRES_PASSWORD: tc, POSTGRES_DB: tc }
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U tc -d tc" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6381:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # A step and not a `services:` entry, because a service container cannot be given a
      # command. The MinIO image's entrypoint is `minio` with no default arguments, so as a
      # service it printed its own usage text, exited, and failed the job before a line of ours
      # ran. It had never started; nobody saw it because this job is `needs: checks` and checks
      # was red for weeks. MinIO has since withdrawn its public images from Docker Hub and quay.io
      # (ADR-0024); this is Chainguard's build.
      - name: object storage
        run: |
          docker run -d --name minio -p 9002:9000 \
            -e MINIO_ROOT_USER=tcadmin -e MINIO_ROOT_PASSWORD=tc-secret-key \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://localhost:9002/minio/health/live && break
            sleep 2
          done
          curl -fsS http://localhost:9002/minio/health/live

      - name: env for the mock provider
        # Real keys never enter CI. AI_PROVIDER=mock streams a canned suggestion (PRD §16 week 1).
        run: |
          cp .env.example .env
          sed -i -E 's/^AUTH_SECRET=.*/AUTH_SECRET=ci-only-secret-0123456789abcdef0123456789/' .env
          sed -i -E 's/^AI_PROVIDER=.*/AI_PROVIDER=mock/; s/^EMBED_PROVIDER=.*/EMBED_PROVIDER=mock/' .env
          sed -i -E 's/^AI_FAST_MODEL=.*/AI_FAST_MODEL=mock-fast/; s/^AI_STRONG_MODEL=.*/AI_STRONG_MODEL=mock-strong/; s/^AI_EMBED_MODEL=.*/AI_EMBED_MODEL=mock-embed/' .env
          # Seventy-odd browser tests each mint an account from this one address; the PRD's twenty
          # sign-ins a minute (the production default) had the suite refusing its own sign-ins.
          echo 'AUTH_RATE_LIMIT_PER_MINUTE=600' >> .env

      - name: build
        run: |
          pnpm --filter @tc/db exec prisma generate
          pnpm turbo run build --filter=@tc/api --filter=@tc/web --filter=@tc/worker

      - name: migrate + seed
        run: pnpm db:migrate && pnpm db:seed

      # The worker is not optional. Extraction, indexing, reference resolution and outline
      # generation are all BullMQ jobs, so without it a seed paper never reaches "Read", an
      # outline never generates, and every spec that waits for one sits out its two-minute
      # timeout and then retries. Nobody noticed because this job was skipped on every run.
      - name: start api, worker and web
        run: |
          (pnpm --filter @tc/api run start:local > api.log 2>&1 &)
          (pnpm --filter @tc/worker run start:local > worker.log 2>&1 &)
          (pnpm --filter @tc/web start > web.log 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/v1/health && break; sleep 2; done
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/ >/dev/null && break; sleep 2; done

      # The browser download is cached by Playwright version; the system libraries are not (they are
      # apt packages, and `install-deps` puts them back in well under a minute).
      - name: playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: playwright browsers
        env:
          PW_CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$PW_CACHE_HIT" = "true" ]; then
            pnpm --filter @tc/web exec playwright install-deps chromium
          else
            pnpm --filter @tc/web exec playwright install --with-deps chromium
          fi

      - name: playwright
        run: pnpm --filter @tc/web e2e

      - name: logs on failure
        if: failure()
        run: tail -n 100 api.log worker.log web.log || true

      # 2026-09-28: a spec that passed five times out of five on a laptop failed twice here, and the
      # trace that would have said why (`trace: 'retain-on-failure'`) died with the runner. Keep it.
      - name: keep the Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
