# The host vhost for Thesis Copilot — ADR-0012.
#
# THIS FILE IS NOT INSTALLED BY THE DEPLOY. It is placed once, by hand, by whoever administers the
# server, and reviewed before it goes anywhere near a machine serving sixteen other domains.
#
# It does one thing: take HTTPS for thesis.rademics.ai and hand it to the stack listening on
# 127.0.0.1:3100. Nothing else on the server is touched — no existing vhost is read, edited or
# reloaded by this file's presence, because each site on that box is its own file.
#
# To install (see docs/RUNBOOK.md for the whole first-deploy sequence):
#
#   1. Point DNS first:  A  thesis  ->  <server ip>
#   2. sudo cp thesis.rademics.ai.conf /etc/nginx/sites-available/thesis.rademics.ai
#   3. sudo ln -s /etc/nginx/sites-available/thesis.rademics.ai /etc/nginx/sites-enabled/
#   4. sudo nginx -t            <- refuses to continue if this file is wrong; nothing reloads
#   5. sudo systemctl reload nginx
#   6. sudo certbot --nginx -d thesis.rademics.ai
#
# Step 4 is the safety net. nginx tests the whole configuration before anything restarts, so a
# mistake here is a refusal, not an outage: the running sites keep serving the old config.
#
# certbot (step 6) rewrites the `listen` lines and fills in the certificate paths itself. Until it
# runs, this file serves plain HTTP on port 80 — which is what certbot needs in order to prove the
# domain and issue the certificate.

server {
    listen 80;
    listen [::]:80;
    server_name thesis.rademics.ai;

    # PRD §12.1. These belong here rather than in the stack's own nginx: HSTS is only meaningful on
    # the connection that terminates TLS, and that is this one. certbot adds the TLS lines below.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    # SAMEORIGIN, not DENY (2026-10-04): "Read beside" shows a source's PDF from this site's own
    # `/thesis-copilot/` path in an iframe, and DENY refuses even a same-site frame. The app's
    # pages still cannot be framed by anyone: their CSP says `frame-ancestors 'none'`.
    add_header X-Frame-Options           "SAMEORIGIN" always;

    # PRD §11.3: 50 MB is the largest PDF a paid plan may upload. `edge.conf` sets the same figure;
    # the smaller of the two wins, so if one changes the other has to.
    client_max_body_size 50M;

    access_log /var/log/nginx/thesis.rademics.ai.access.log;
    error_log  /var/log/nginx/thesis.rademics.ai.error.log;

    # Appendix B.8: Assist streams tokens as they are produced, and a proxy that buffers turns that
    # into one lump arriving at the end. The API sends `X-Accel-Buffering: no`, which nginx honours
    # by itself; `proxy_buffering off` says it again explicitly so a future edit to the app cannot
    # silently take the behaviour away.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # A coherence run can stream for minutes before it finishes.
        proxy_connect_timeout 30s;
        proxy_send_timeout    10m;
        proxy_read_timeout    10m;
    }

    # ADR-0028: live co-authoring is a WebSocket. `Connection "upgrade"` lets the handshake
    # through to the edge, which routes it to the one instance that holds the rooms.
    location /collab/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_read_timeout 5m;
    }
}
