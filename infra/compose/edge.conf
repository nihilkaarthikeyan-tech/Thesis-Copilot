# Routing inside our own stack — ADR-0012, replacing the Caddyfile.
#
# This nginx is NOT the internet-facing one. It listens on port 80 inside the Compose network and
# is published on 127.0.0.1:3100 only; the host's nginx terminates TLS and proxies here. See
# `infra/nginx/thesis.rademics.ai.conf` for that half.
#
# It exists rather than publishing `web` and `api` on two loopback ports because `api` runs two
# replicas (PRD §13.2) and two containers cannot share one published host port.

# Docker's embedded DNS, and the whole reason this file does not use an `upstream` block.
#
# nginx resolves an upstream host **once, at startup**, and then caches the address forever. Every
# deploy recreates `api` and `web` with new container IPs, so a cached address is a dead address:
# the site would 502 after each release until someone restarted this container, and the cause
# would look like "the new version is broken" rather than "the proxy is pointing at a ghost".
#
# Resolving through a variable defers the lookup to request time, and `valid=10s` caps how long a
# stale answer can survive. 127.0.0.11 is Docker's resolver on every Compose network. `ipv6=off`
# because our services are v4-only inside the network and asking for AAAA just adds a failed
# lookup to every request.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    # PRD §11.3: 50 MB is the largest PDF a paid plan may upload. The host vhost sets the same
    # limit; the smaller of the two wins, so they must not drift apart.
    client_max_body_size 50M;

    # No security headers here on purpose. HSTS only means anything on the connection that
    # terminated TLS, and that is the host's nginx (ADR-0012). Setting them twice sends them twice.

    # Appendix B.8: the Assist stream must reach the browser token by token. The API already sends
    # `X-Accel-Buffering: no`, which nginx obeys on its own — this is the explicit belt to that
    # braces, because a buffered stream does not error, it just arrives in one lump and reads as
    # "the feature is slow".
    location /api/ {
        # `$request_uri` is appended explicitly: with a variable in proxy_pass, nginx does not
        # rewrite the path the way it does for a literal, so leaving it off would send every
        # request to `/`.
        set $tc_api http://api:3001;
        proxy_pass $tc_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # A coherence run streams for minutes. 10m matches what the Caddyfile allowed.
        proxy_connect_timeout 30s;
        proxy_send_timeout    10m;
        proxy_read_timeout    10m;
    }

    # PRD §13.1: the Prometheus scrape path is internal only. Prometheus reaches the API directly
    # over the Compose network, so nothing legitimate asks for it here.
    location = /metrics {
        return 404;
    }

    location / {
        set $tc_web http://web:3000;
        proxy_pass $tc_web$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_read_timeout 5m;
    }
}
